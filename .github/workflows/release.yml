name: Publish Release

on:
  workflow_run:
    workflows: ["Android Build, Test and Release"]
    types: [completed]
    branches: [main, master]

permissions:
  contents: write
  actions: read

jobs:
  release:
    name: Create GitHub release from CI artifacts
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Resolve version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          base=534
          count=$(git rev-list --count HEAD)
          code=$((base + count))
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "name=1.0.$code" >> "$GITHUB_OUTPUT"
          echo "short_sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "tag=v1.0.$code" >> "$GITHUB_OUTPUT"

      - name: Download APK artifacts
        uses: actions/download-artifact@v4
        with:
          name: aura-apks-${{ github.event.workflow_run.run_number }}
          path: dist/apks
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download AAB artifact
        uses: actions/download-artifact@v4
        with:
          name: aura-aab-${{ github.event.workflow_run.run_number }}
          path: dist/aab
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: List release files
        shell: bash
        run: |
          set -euo pipefail
          find dist -type f -ls || true

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: AURA ${{ steps.version.outputs.name }}
          target_commitish: ${{ github.event.workflow_run.head_sha }}
          body: |
            Automated release from successful CI build.
            - Run: ${{ github.event.workflow_run.html_url }} (#${{ github.event.workflow_run.run_number }})
            - Commit: ${{ github.event.workflow_run.head_sha }}
            - Version: ${{ steps.version.outputs.name }}
          files: |
            dist/apks/**/*.apk
            dist/aab/**/*.aab
          generate_release_notes: true
          fail_on_unmatched_files: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
