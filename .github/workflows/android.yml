name: Android Build, Report and Release

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a GitHub release with the built APKs"
        type: boolean
        default: false
      release_tag:
        description: "Release tag (leave empty to use v<versionName>)"
        type: string
        required: false

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  actions: read

env:
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8"
  # Optional production signing. Set these repository secrets to publish upgrade-compatible APKs;
  # without them the release build is signed with the debug key so it still installs.
  AURA_KEYSTORE_BASE64: ${{ secrets.AURA_KEYSTORE_BASE64 }}
  AURA_KEYSTORE_PASSWORD: ${{ secrets.AURA_KEYSTORE_PASSWORD }}
  AURA_KEY_ALIAS: ${{ secrets.AURA_KEY_ALIAS }}
  AURA_KEY_PASSWORD: ${{ secrets.AURA_KEY_PASSWORD }}

jobs:
  build:
    name: Build, report and release
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' }}

      - name: Reject committed secrets
        shell: bash
        run: |
          set -euo pipefail
          if git grep -nE '(gsk_[A-Za-z0-9]{20,}|sk-or-v1-|nvapi-[A-Za-z0-9_-]{20,}|AIza[0-9A-Za-z_-]{30,}|tvly-[A-Za-z0-9]{20,})' -- \
              ':!*.md' ':!app/src/main/assets/*' ':!.github/*' ; then
            echo "::error::A provider key pattern was found in the repository."
            exit 1
          fi

      - name: Prepare optional release signing
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${AURA_KEYSTORE_BASE64:-}" ]; then
            echo "$AURA_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/aura-release.jks"
            cat > keystore.properties <<EOF
          storeFile=$RUNNER_TEMP/aura-release.jks
          storePassword=$AURA_KEYSTORE_PASSWORD
          keyAlias=$AURA_KEY_ALIAS
          keyPassword=$AURA_KEY_PASSWORD
          EOF
            echo "release_signing=production" >> "$GITHUB_ENV"
          else
            echo "release_signing=debug-key-fallback" >> "$GITHUB_ENV"
          fi

      - name: Resolve version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          base=534
          count=$(git rev-list --count HEAD)
          code=$((base + count))
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "name=1.0.$code" >> "$GITHUB_OUTPUT"
          echo "short_sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "Built version 1.0.$code (commit $count, sha $(git rev-parse --short HEAD))"

      - name: Assemble debug
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build-report
          gradle :app:assembleDebug --stacktrace --no-daemon 2>&1 | tee build-report/gradle-debug.log

      - name: Assemble release
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build-report
          gradle :app:assembleRelease --stacktrace --no-daemon 2>&1 | tee build-report/gradle-release.log

      - name: Certificate fingerprints and checksums
        shell: bash
        run: |
          set -uo pipefail
          out=build-report/certificates.txt
          : > "$out"
          echo "AURA build certificate report" >> "$out"
          echo "commit: $(git rev-parse HEAD)" >> "$out"
          echo "generated: $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$out"
          echo >> "$out"
          for apk in app/build/outputs/apk/debug/*.apk app/build/outputs/apk/release/*.apk; do
            [ -f "$apk" ] || continue
            {
              echo "== $apk"
              echo "size_bytes: $(stat -c%s "$apk")"
              echo "sha256: $(sha256sum "$apk" | awk '{print $1}')"
              echo "signing:"
              keytool -printcert -jarfile "$apk" 2>/dev/null | grep -E 'Owner:|Valid from:|SHA1:|SHA256:' | sed 's/^/  /' || echo "  unsigned or unreadable"
              echo
            } >> "$out"
          done
          cat "$out"

      - name: Build report
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          report=build-report/REPORT.md
          {
            echo "# AURA build report"
            echo
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Run | [${GITHUB_RUN_NUMBER}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}) |"
            echo "| Commit | \`${GITHUB_SHA}\` |"
            echo "| Ref | \`${GITHUB_REF}\` |"
            echo "| Version | \`1.0.${{ steps.version.outputs.code }}\` |"
            echo "| Release signing | \`${release_signing:-unknown}\` |"
            echo "| Java | \`$(java -version 2>&1 | head -1)\` |"
            echo "| Gradle | \`$(gradle --version 2>/dev/null | grep '^Gradle ' | head -1)\` |"
            echo "| Android SDK | \`compileSdk 36, build-tools $(ls "$ANDROID_HOME/build-tools" 2>/dev/null | sort -V | tail -1)\` |"
            echo
            echo "## APKs"
            echo
            found=0
            for apk in app/build/outputs/apk/debug/*.apk app/build/outputs/apk/release/*.apk; do
              [ -f "$apk" ] || continue
              found=1
              echo "- \`$apk\` — $(stat -c%s "$apk") bytes — sha256 \`$(sha256sum "$apk" | awk '{print $1}')\`"
            done
            [ "$found" -eq 1 ] || echo "_No APK was produced. See the Gradle logs artifact._"
            echo
            if [ -f build-report/certificates.txt ]; then
              echo "## Certificates"
              echo
              echo '```'
              cat build-report/certificates.txt
              echo '```'
              echo
            fi
            echo "## Gradle result"
            echo
            echo "- debug log: \`build-report/gradle-debug.log\`"
            echo "- release log: \`build-report/gradle-release.log\`"
            if grep -qE '^BUILD SUCCESSFUL' build-report/gradle-debug.log 2>/dev/null && \
               grep -qE '^BUILD SUCCESSFUL' build-report/gradle-release.log 2>/dev/null; then
              echo "- status: **BUILD SUCCESSFUL**"
            else
              echo "- status: **BUILD FAILED** — inspect the logs artifact and the failing step above."
            fi
          } > "$report"
          cat "$report" >> "$GITHUB_STEP_SUMMARY"
          cat "$report"

      - name: Collect APKs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aura-apks-${{ github.run_number }}
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
          retention-days: 14

      - name: Collect build report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aura-build-report-${{ github.run_number }}
          path: build-report/
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub release
        if: |
          success() && (
            startsWith(github.ref, 'refs/tags/v') ||
            (github.event_name == 'workflow_dispatch' && inputs.release)
          )
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag != '' && inputs.release_tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || format('v{0}', steps.version.outputs.name) }}
          name: AURA ${{ steps.version.outputs.name }}
          body_path: build-report/REPORT.md
          files: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          generate_release_notes: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
