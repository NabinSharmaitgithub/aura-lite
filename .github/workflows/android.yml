name: Android Build, Test and Release

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a GitHub release with built artifacts"
        type: boolean
        default: false
      release_tag:
        description: "Release tag (leave empty to auto-generate)"
        type: string
        required: false
      release_name:
        description: "Release name"
        type: string
        required: false
      release_notes:
        description: "Release notes"
        type: string
        required: false

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  actions: read

env:
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8"
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
  # Optional production signing. Without these secrets the release build is signed with the debug key.
  AURA_KEYSTORE_BASE64: ${{ secrets.AURA_KEYSTORE_BASE64 }}
  AURA_KEYSTORE_PASSWORD: ${{ secrets.AURA_KEYSTORE_PASSWORD }}
  AURA_KEY_ALIAS: ${{ secrets.AURA_KEY_ALIAS }}
  AURA_KEY_PASSWORD: ${{ secrets.AURA_KEY_PASSWORD }}
  # Optional: base64-encoded app/google-services.json. Without it Firebase plugins stay disabled.
  GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
  SHERPA_AAR_URL: https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.12.28/sherpa-onnx-static-link-onnxruntime-1.12.28.aar
  SHERPA_AAR_PATH: app/libs/sherpa-onnx-static-link-onnxruntime-1.12.28.aar

jobs:
  build:
    name: Build, test and release
    runs-on: ubuntu-latest
    timeout-minutes: 75

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        shell: bash
        run: |
          set -euo pipefail
          test -d "$ANDROID_HOME"
          SDKMANAGER=$(find "$ANDROID_HOME" -name sdkmanager -type f | head -1)
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found under $ANDROID_HOME"
            ls -la "$ANDROID_HOME"
            exit 1
          fi
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0" "platform-tools"
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "build-tools: $(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Cache sherpa-onnx AAR
        id: sherpa-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.SHERPA_AAR_PATH }}
          key: sherpa-onnx-aar-v1.12.28

      - name: Download sherpa-onnx AAR
        if: steps.sherpa-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/libs
          curl -fL --retry 3 --retry-delay 5 -o "$SHERPA_AAR_PATH" "$SHERPA_AAR_URL"
          ls -lh "$SHERPA_AAR_PATH"

      - name: Verify sherpa-onnx AAR
        shell: bash
        run: |
          set -euo pipefail
          test -s "$SHERPA_AAR_PATH"
          ls -lh "$SHERPA_AAR_PATH"

      - name: Prepare optional release signing
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${AURA_KEYSTORE_BASE64:-}" ]; then
            echo "$AURA_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/aura-release.p12"
            cat > keystore.properties <<EOF
          storeFile=$RUNNER_TEMP/aura-release.p12
          storeType=PKCS12
          storePassword=$AURA_KEYSTORE_PASSWORD
          keyAlias=$AURA_KEY_ALIAS
          keyPassword=$AURA_KEY_PASSWORD
          EOF
            echo "release_signing=production" >> "$GITHUB_ENV"
          else
            echo "release_signing=debug-key-fallback" >> "$GITHUB_ENV"
          fi

      - name: Prepare optional google-services.json
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${GOOGLE_SERVICES_JSON_BASE64:-}" ]; then
            echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > app/google-services.json
            echo "configured OK ($(wc -c < app/google-services.json) bytes)"
            echo "google_services_json=present" >> "$GITHUB_ENV"
          else
            echo "absent — building offline-only (Firebase stays disabled at runtime)"
            echo "google_services_json=absent" >> "$GITHUB_ENV"
          fi

      - name: Reject committed secrets
        shell: bash
        run: |
          set -euo pipefail
          if git grep -nE '(gsk_[A-Za-z0-9]{20,}|sk-or-v1-|nvapi-[A-Za-z0-9_-]{20,}|AIza[0-9A-Za-z_-]{30,}|tvly-[A-Za-z0-9]{20,})' -- \
              ':!*.md' ':!app/src/main/assets/*' ':!.github/*' ; then
            echo "::error::A provider key pattern was found in the repository."
            exit 1
          fi

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Resolve version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          base=534
          count=$(git rev-list --count HEAD)
          code=$((base + count))
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "name=1.0.$code" >> "$GITHUB_OUTPUT"
          echo "short_sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "Built version 1.0.$code (commit $count, sha $(git rev-parse --short HEAD))"

      - name: Run unit tests
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build-report
          ./gradlew :app:testDebugUnitTest :mcp-server:test --stacktrace --no-daemon 2>&1 | tee build-report/gradle-tests.log

      - name: Assemble debug APK
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build-report
          ./gradlew :app:assembleDebug --stacktrace --no-daemon 2>&1 | tee build-report/gradle-debug.log

      - name: Assemble release APK
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build-report
          ./gradlew :app:assembleRelease --stacktrace --no-daemon 2>&1 | tee build-report/gradle-release.log

      - name: Bundle release AAB
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build-report
          ./gradlew :app:bundleRelease --stacktrace --no-daemon 2>&1 | tee build-report/gradle-bundle.log

      - name: Certificate fingerprints and checksums
        shell: bash
        run: |
          set -uo pipefail
          out=build-report/certificates.txt
          APKSIGNER=$(find "$ANDROID_HOME" -type f -name apksigner 2>/dev/null | sort -V | tail -1)
          : > "$out"
          echo "AURA build certificate report" >> "$out"
          echo "commit: $(git rev-parse HEAD)" >> "$out"
          echo "generated: $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$out"
          echo "apksigner: ${APKSIGNER:-not found}" >> "$out"
          echo >> "$out"
          for apk in app/build/outputs/apk/debug/*.apk app/build/outputs/apk/release/*.apk; do
            [ -f "$apk" ] || continue
            {
              echo "== $apk"
              echo "size_bytes: $(stat -c%s "$apk")"
              echo "sha256: $(sha256sum "$apk" | awk '{print $1}')"
              echo "signing:"
              if [ -n "$APKSIGNER" ] && [ -x "$APKSIGNER" ]; then
                "$APKSIGNER" verify --print-certs "$apk" 2>&1 | sed 's/^/  /' || true
                "$APKSIGNER" verify "$apk" >/dev/null 2>&1 \
                  && echo "  signature_valid: yes" \
                  || echo "  signature_valid: no"
              else
                keytool -printcert -jarfile "$apk" 2>/dev/null \
                  | grep -E 'Owner:|Valid from:|SHA1:|SHA256:' \
                  | sed 's/^/  /' || echo "  unsigned or unreadable"
              fi
              echo
            } >> "$out"
          done
          for aab in app/build/outputs/bundle/release/*.aab; do
            [ -f "$aab" ] || continue
            echo "== $aab" >> "$out"
            echo "size_bytes: $(stat -c%s "$aab")" >> "$out"
            echo "sha256: $(sha256sum "$aab" | awk '{print $1}')" >> "$out"
            echo >> "$out"
          done
          cat "$out"

      - name: Verify APK signatures
        shell: bash
        run: |
          set -euo pipefail
          APKSIGNER=$(find "$ANDROID_HOME" -type f -name apksigner | sort -V | tail -1)
          if [ -z "$APKSIGNER" ]; then
            echo "::error::apksigner not found in the Android SDK"
            exit 1
          fi
          found=0
          for apk in app/build/outputs/apk/debug/*.apk app/build/outputs/apk/release/*.apk; do
            [ -f "$apk" ] || continue
            found=1
            echo "verifying $apk"
            "$APKSIGNER" verify --verbose "$apk" | sed 's/^/  /'
          done
          [ "$found" -eq 1 ] || { echo "::error::No APKs found to verify"; exit 1; }

      - name: Build report
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p build-report
          report=build-report/REPORT.md
          {
            echo "# AURA build report"
            echo
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Run | [${GITHUB_RUN_NUMBER}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}) |"
            echo "| Commit | \`${GITHUB_SHA}\` |"
            echo "| Ref | \`${GITHUB_REF}\` |"
            echo "| Version | \`1.0.${{ steps.version.outputs.code }}\` |"
            echo "| Release signing | \`${release_signing:-unknown}\` |"
            echo "| Firebase wiring | \`${google_services_json:-unknown}\` |"
            echo "| Java | \`$(java -version 2>&1 | head -1)\` |"
            echo "| Gradle wrapper | \`$(./gradlew --version 2>/dev/null | grep '^Gradle ' | head -1)\` |"
            echo "| Android SDK | \`compileSdk 36, build-tools $(ls "$ANDROID_HOME/build-tools" 2>/dev/null | sort -V | tail -1)\` |"
            echo
            echo "## Artifacts"
            echo
            found=0
            for f in app/build/outputs/apk/debug/*.apk app/build/outputs/apk/release/*.apk app/build/outputs/bundle/release/*.aab; do
              [ -f "$f" ] || continue
              found=1
              echo "- \`$f\` — $(stat -c%s "$f") bytes — sha256 \`$(sha256sum "$f" | awk '{print $1}')\`"
            done
            [ "$found" -eq 1 ] || echo "_No build artifacts were produced. See logs in the build report artifact._"
            echo
            echo "## Logs"
            echo
            for f in gradle-tests.log gradle-debug.log gradle-release.log gradle-bundle.log; do
              [ -f "build-report/$f" ] && echo "- \`build-report/$f\`"
            done
            echo
            echo "## Status"
            echo
            ok=true
            for f in gradle-tests.log gradle-debug.log gradle-release.log gradle-bundle.log; do
              if [ -f "build-report/$f" ] && ! grep -q '^BUILD SUCCESSFUL' "build-report/$f"; then ok=false; fi
            done
            if $ok; then echo "**BUILD SUCCESSFUL**"; else echo "**BUILD FAILED** — inspect the logs and failing step above."; fi
          } > "$report"
          cat "$report" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APKs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aura-apks-${{ github.run_number }}
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
          retention-days: 14

      - name: Upload AAB
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aura-aab-${{ github.run_number }}
          path: |
            app/build/outputs/bundle/release/*.aab
          if-no-files-found: warn
          retention-days: 14

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aura-reports-${{ github.run_number }}
          path: |
            build-report/
            app/build/outputs/mapping/release/**
            app/build/reports/**
            mcp-server/build/reports/**
            mcp-server/build/test-results/**
          if-no-files-found: warn
          retention-days: 30

      - name: Publish GitHub release
        if: |
          success() && (
            startsWith(github.ref, 'refs/tags/v') ||
            (github.event_name == 'workflow_dispatch' && inputs.release)
          )
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag != '' && inputs.release_tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || format('v{0}', steps.version.outputs.name) }}
          name: ${{ inputs.release_name != '' && inputs.release_name || format('AURA {0}', steps.version.outputs.name) }}
          body: ${{ inputs.release_notes != '' && inputs.release_notes || format('Automated build for AURA {0} (commit {1}).', steps.version.outputs.name, steps.version.outputs.short_sha) }}
          files: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
          generate_release_notes: true
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
