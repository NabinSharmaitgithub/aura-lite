org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 -Djava.io.tmpdir=/data/data/com.termux/files/usr/tmp
org.gradle.parallel=false
org.gradle.caching=true
org.gradle.vfs.watch=false
org.gradle.daemon=false
org.gradle.configuration-cache=false
# The sherpa AAR fetch task runs a network download and is not configuration-cache safe;
# correctness of the build is more important than reusing the configuration cache here.
org.gradle.configuration-cache=false

android.useAndroidX=true
android.nonTransitiveRClass=true
android.nonFinalResIds=true

# AGP 8.9's tested ceiling is API 35; the project targets the final API 36 SDK.
android.suppressUnsupportedCompileSdk=36

kotlin.code.style=official
kotlin.incremental=true

# Do not hand-bump. versionCode = versionBase + git commit count.
aura.versionBase=534
org.gradle.java.installations.auto-detect=false
org.gradle.java.installations.auto-download=false
org.gradle.java.installations.paths=/data/data/com.termux/files/usr/lib/jvm/java-21-openjdk
org.gradle.java.home=/data/data/com.termux/files/usr/lib/jvm/java-21-openjdk
